# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/anygame-engine
#
# Design stage, markdown only: the agent triages, answers, reviews and keeps links and claims
# accurate. There is no CI to name and nothing to release yet. Revisit `required_checks`,
# `auto_merge_scope` and `release` when engine code and `bin/check` land.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Anything derived from leaked source code or decompiled binaries"
    - "A recreation of a specific existing game's name, characters, art, music or levels"
    - "Kernel-level client anti-cheat, shipped, integrated or recommended"
    - "A GUI editor in the core: community packages on the public command protocol are welcome"
    - "A new programming language, VCS, DCC tool, from-scratch physics solver, or second object model beside the ECS"
    - "Requiring a companion tool, cloud service, account, fee or telemetry to build or ship a game"
    - "A private API for first-party modules, or a vendor name above a port"
    - "Claims of performance or superiority without a reproducible measurement"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  required_checks: []
  auto_merge: true
  # No CI gates a merge yet, and coding agents read these docs as instructions, so an outside
  # contributor's PR waits for a member.
  auto_merge_scope: own_and_dependency_bots
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true

release:
  manager: none
  channels: []

escalate:
  ask_before_acting:
    - "Changing LICENSE or any commitment in docs/idea/31-no-regrets.md"
    - "Changing the objective or design rules in docs/idea/01-thesis.md"
    - "Changing a stable contract listed in docs/idea/22-future-ready.md"
    - "Adding or changing a recommended partner or paid service"

schedules:
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
